name: Deploy latest release to GitHub Pages

# The published site always reflects the most recent release, not the tip of
# main. Pushing to main changes nothing that is live until you cut a release.
#
# Two one-time settings are needed, both requiring repo admin rights that
# GITHUB_TOKEN does not have, so neither can be automated from here:
#
#   1. Settings -> Pages -> Source: "GitHub Actions".
#      Otherwise the deploy fails with "Resource not accessible by integration".
#
#   2. Settings -> Environments -> github-pages -> Deployment branches and tags
#      -> add a rule with ref type "Tag" and pattern "v*".
#      The environment ships allowing only the default branch. Because this
#      workflow is triggered by a release, the run's ref is the tag (e.g.
#      refs/tags/v1.1), which that default policy rejects with "Tag v1.1 is not
#      allowed to deploy to github-pages due to environment protection rules".
#      Equivalent one-liner:
#        gh api --method POST \
#          repos/OWNER/REPO/environments/github-pages/deployment-branch-policies \
#          -f name='v*' -f type='tag'
on:
  release:
    types: [published]
  # Re-deploy the current latest release without publishing anything new.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once. Don't cancel a run already in flight —
# letting it finish leaves the site in a known state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve latest release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      deploy: ${{ steps.pick.outputs.deploy }}
    steps:
      # Publishing an older release, or re-publishing one out of order, would
      # otherwise overwrite the site with stale code. Only ever deploy the tag
      # GitHub itself considers latest. Note that /releases/latest ignores
      # drafts and prereleases, so a prerelease never reaches the live site.
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          echo "Latest release: $latest"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"

          if [ -n "${EVENT_TAG:-}" ] && [ "$EVENT_TAG" != "$latest" ]; then
            echo "::notice::$EVENT_TAG is not the latest release ($latest) - skipping deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Verify decoder
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # verify:         decodes exmple_log/LOG00015.BFL and asserts frame count,
      #                 duration, rate and per-field min/max
      # verify-numbers: German/English/ambiguous decimal handling and units
      # verify-csv:     delimiter sniffing, quoting, ragged rows, time scaling
      # Any mismatch exits non-zero and blocks the release from going live.
      - name: Run decoder regression tests
        run: |
          node test/verify.mjs
          node test/verify-numbers.mjs
          node test/verify-csv.mjs

  deploy:
    name: Deploy
    needs: [resolve, test]
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      # No actions/configure-pages step: it exists to hand a base URL to static
      # site generators, and every path in this site is relative, so it only
      # added a step that could fail.
      #
      # The site needs no build, so publish the tag as-is. Leave
      # include-hidden-files at its default of false: with path "." turning it
      # on would sweep .git into the published artifact.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
